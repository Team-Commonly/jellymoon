name: CI
# Runs on every pull request and every push to main, and runs the checks `make preflight` runs. A failing check run blocks a land
# (docs/development/landing.md). CI never lands anything: `make land` stays the only merge path.

# Verification loop (docs/development/workflow.md). Each check is a job here. A job passes only by running what it is named
# for: when the code it needs is missing, or it ran nothing, it fails. A job that cannot test anything is removed, not stubbed.
# Budget: 5 minutes wall clock for the whole workflow.

on:
  workflow_dispatch:
  # Never `pull_request_target`: it runs with secrets.
  pull_request:
  push:
    # land/** is `make land`'s own ref: it pushes the merge commit of a PR there so these checks run on the exact tree it will merge
    # (docs/development/landing.md, step 5).
    branches: [main, 'land/**']

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. The only secret is the names list of the deny check (private; GitHub withholds it from fork pull
# requests, so it is empty there). No job deploys anywhere or needs a cloud account.
permissions:
  contents: read

jobs:
  gen-drift:
    runs-on: ubuntu-latest
    # Runs make test-ts (fixtures, generated types, land/scan self-tests): 158-188 s on 11-09. A timeout reads as cancelled, which land refuses.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: ./.github/actions/setup-go
      - name: Portable (no symlink out of the repo, no machine-local path)
        run: make portable
      - name: Generated contracts match the schema
        run: make check-gen
      - name: Fixtures validate (ajv) and generated TS type-checks
        run: make test-ts
      - name: Entropy gate (budgets, ratchet, dead code, boundaries)
        run: make entropy

  private:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - name: Nothing private in tracked files (the deny check)
        # Only this step sees the names list. It is empty on fork pull requests, where GitHub withholds secrets; the check
        # then says the names class was skipped. The check prints `file:line: class`, never the matched text.
        env:
          JM_PRIVATE_NAMES: ${{ secrets.JM_PRIVATE_NAMES }}
        run: make private

  secrets:
    runs-on: ubuntu-latest
    # 5, was 4: same fallback headroom as the go job.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Full history of all branches (merge commits included) and the tracked tree (gitleaks)
        run: make secrets-all

  # On a pull request, and on a land/** push (the merge commit `make land` builds: its parents are main's tip and the PR head, and the same
  # range is checked): every commit the PR adds must be signed off by its own author (DCO, CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/land/'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by matches the commit author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then BASE=$(git rev-parse HEAD^1); HEAD=$(git rev-parse HEAD^2); fi
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -z "$commits" ]; then echo "::error::no commits found in $BASE..$HEAD"; exit 1; fi
          fail=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::$c has no 'Signed-off-by: $author' line (use git commit -s)"; fail=1
            fi
          done
          exit $fail

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - name: Worker unit tests (bun test fails when it finds none)
        run: make test-worker

  go:
    runs-on: ubuntu-latest
    # 5, was 3: when setup-go fails, its three 504 retries plus the dl.google.com fallback download come before any test.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Daemon, ACP and TUI tests
        run: make test-go

  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: ./.github/actions/setup-go
      - name: The contract suite against the pod-state server on a Postgres service container (make e2e-c)
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL is unset: this job must run on Postgres, never on the in-process fallback"; exit 1; fi
          if [ ! -d e2e ]; then echo "::error::no e2e/ directory"; exit 1; fi
          make e2e-c

  e2e-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: ./.github/actions/setup-go
      - name: The contract suite against the Worker under wrangler dev --local (make e2e-a)
        run: |
          if [ ! -d e2e ]; then echo "::error::no e2e/ directory"; exit 1; fi
          make e2e-a

  browser:
    # The browser specs (web-e2e/, docs/development/browser-specs.md): each spec at 390x844 and 1440x900 in Chromium, against the
    # pod-state server on the in-process Postgres (ENV=local) with the fake agent, never a deployed one. The browser is installed
    # here, in the job, at the version the lockfile pins; it is never installed on a laptop for this.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Dependencies (the lockfile's Playwright)
        run: make node_modules
      - name: Chromium and its system libraries, at the pinned Playwright's version
        run: node_modules/.bin/playwright install --with-deps chromium
      - name: Build the web client and run the browser specs (make e2e-web)
        run: |
          if [ ! -d web-e2e ]; then echo "::error::no web-e2e/ directory"; exit 1; fi
          make e2e-web
      - name: Report and traces of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-specs
          path: |
            web-e2e/report/
            web-e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e-deployed:
    # The server as a self-hoster runs it: the PR's own release bundle, started as its own process against a Postgres service
    # container (make deployed-boot), then the contract suite with that bundle as the server under test. No secret, no cloud
    # account, so it runs on pull requests from forks too.
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: ./.github/actions/setup-go
      - name: Boot the release bundle on Postgres and run the contract suite against it (make e2e-deployed)
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::DATABASE_URL is unset: this job must run on Postgres, never on the in-process fallback"; exit 1; fi
          make e2e-deployed
