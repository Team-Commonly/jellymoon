name: CI
# Runs on every pull request and every push to main, and runs the checks `make preflight` runs. A failing check run blocks a land
# (docs/development/landing.md). CI never lands anything: `make land` stays the only merge path.

# Verification loop (docs/development/workflow.md). Each check is a job here.
# Budget: 5 minutes wall clock for the whole workflow.

on:
  workflow_dispatch:
  # Never `pull_request_target`: it runs with secrets.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. The only secrets are JM_CF_PREVIEW_TOKEN and JM_CF_ACCOUNT_ID (e2e-preview, skipped for fork pull requests)
# and the names list of the deny check (private; GitHub withholds it from fork pull requests, so it is empty there).
# No job passes by skipping: a job that has nothing to test fails. The one job whose code does not exist yet, install, is not here;
# the unit that adds worker/public/install.sh adds that job back.
permissions:
  contents: read

jobs:
  gen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Portable (no symlink out of the repo, no machine-local path)
        run: make portable
      - name: Generated contracts match the schema
        run: make check-gen
      - name: Fixtures validate (ajv) and generated TS type-checks
        run: make test-ts
      - name: Entropy gate (budgets, ratchet, dead code, boundaries)
        run: make entropy

  private:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - name: Nothing private in tracked files (the deny check)
        # Only this step sees the names list. It is empty on fork pull requests, where GitHub withholds secrets; the check
        # then says the names class was skipped. The check prints `file:line: class`, never the matched text.
        env:
          JM_PRIVATE_NAMES: ${{ secrets.JM_PRIVATE_NAMES }}
        run: make private

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Full history of all branches (merge commits included) and the tracked tree (gitleaks)
        run: make secrets-all

  # Only on a pull request: every commit the PR adds must be signed off by its own author (DCO, CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by matches the commit author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -z "$commits" ]; then echo "::error::no commits found in $BASE..$HEAD"; exit 1; fi
          fail=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::$c has no 'Signed-off-by: $author' line (use git commit -s)"; fail=1
            fi
          done
          exit $fail

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - name: TypeScript tests (make test-ts; fails if no test runs)
        run: make test-ts

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Daemon, ACP and TUI tests
        run: make test-go

  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: The contract suite against the Worker under wrangler dev --local (make e2e-a, as in make preflight)
        run: |
          make e2e-a

  e2e-preview:
    # Deploys this run's code to its own Worker (jellymoon-spike-pr-<number>, or jellymoon-spike-main on a push to main) with its own
    # Durable Object namespace and D1 database, runs the contract suite against it over HTTPS and the pod WebSocket, and removes both
    # (worker/preview.sh, docs/development/e2e-contract.md "Remote mode"). Needs secrets, so it never runs on a pull request from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: gen-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PREVIEW_NAME: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
      JM_CF_PREVIEW_TOKEN: ${{ secrets.JM_CF_PREVIEW_TOKEN }}
      JM_CF_ACCOUNT_ID: ${{ secrets.JM_CF_ACCOUNT_ID }}
    steps:
      - name: Refuse without the preview secrets
        # A skip that exits 0 would pass without testing what the job names. Here a missing secret is a failure.
        run: |
          if [ -z "$JM_CF_PREVIEW_TOKEN" ] || [ -z "$JM_CF_ACCOUNT_ID" ]; then
            echo "::error::JM_CF_PREVIEW_TOKEN and JM_CF_ACCOUNT_ID must both be set as repository secrets; e2e-preview cannot test the preview without them"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Deploy the preview (own Worker, own Durable Object namespace, own D1 database)
        run: worker/preview.sh up "$PREVIEW_NAME"
      - name: Run the contract suite against the preview
        # The whole suite runs; each test skips itself with a reason when it cannot run on a deployed Worker. When F14 lands, add the
        # next line to name it (docs/development/e2e-contract.md, "Remote mode"):
        #   env: { JM_E2E_RUN: TestF14 }
        run: worker/preview.sh run
      - name: Tear the preview down
        if: always()
        run: worker/preview.sh down "$PREVIEW_NAME"
