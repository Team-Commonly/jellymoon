# The numbers `cargo xtask check` holds the repo to (crates/xtask/src/rules.rs). A budget may be raised only with a
# reason in the same change; how long a function may be is in clippy.toml.

# The most lines a Rust file may have.
max_file_lines = 400

# The most lines of Rust each crate may hold, tests included. Every crate needs one.
[budget]
# Finding the harness off `PATH` raised the next two: core by 94 (`find.rs`: the well-known places, the mode checks,
# the child's `PATH`, the one home) and the binary by 273 (its tests at the binary, `tests/harness.rs`, are 252 of them).
# The first run raised them again: core by 120 (the reader of `skip.txt`, moved in from the app, with what it refuses;
# the one rule for Jellymoon's home; four plain errors) and the binary by 354 (its tests at the binary:
# `tests/first_run.rs`, one in `tests/f33.rs` and the helper that compares a whole folder).
# The closed list of characters that cannot be seen, and the check of `--skip` names against it, raised core by 25
# and the binary by 17 (the test's array of every entry).
# F35 and F36 raised them once more: core by 448 (`tap.rs`, the tap's rules, is 274 and `command.rs`, the check of the
# installed command, 105; the rest is `hook_installed`, the waiting rulings and the create-new write)
# and the binary by 786 (`settle`, `hook status` and `hook install --installed`; nearly all of it their tests at the binary:
# `tests/f35.rs`, `tests/f35/delivery.rs` and `tests/f35/lock.rs`).
"crates/jellymoon-core" = 3090
"crates/jellymoon" = 3576
# The smoke chain raised xtask by 464: the runner, its nine steps and their tests (docs/development/smoke.md); F29's
# four delivery steps raised it by 76, and the step for a harness found off `PATH` by 30. The step for a home with no
# session logs raised it by 12, and F35's three steps (`tap`, `tap-told`, `today-settled`) by 49.
"crates/xtask" = 1091
# F32 raised the next two: the kit by 291 (the F32 test, the edge tests of the theme door's limits, two draw tests;
# 265 of the lines are tests) and the app by 89 (`--theme <file>`, and its case at the binary, 60 lines).
# The art's counted cost raised the kit by 247 (the two counts at the door, their edge tests in `tests/cost.rs`).
# A whole choice (F35: every word of an option, or the note left out) raised the kit by 110: 84 are `tests/whole.rs`.
# A text run's own size, which the drawing paints at, raised the kit by 80: 77 are the two tests that hold it
# (`tests/whole.rs` by measure, `tests/draw.rs` by what is painted).
"crates/sticker-kit" = 5553
# F29 raised the app by 9: the arm for core's new errors where it puts an error into words. Its note for a harness
# that was not found names the places looked in: 1 line.
# The app's test of a `--skip` name that is refused: 6 lines.
# F35 raised the app by 560: `taps.rs` (a tap carried to core and drawn), its cases in `tests/f35.rs`, and the
# scene, the window and the day drawing what core says stands.
"app" = 2994

# The workspace crates each crate may depend on. Core depends on none; the binary only on core.
[depends]
jellymoon-core = []
jellymoon = ["jellymoon-core"]
xtask = []
# The kit knows nothing of Jellymoon; the app is the only crate that joins the kit and core.
sticker-kit = []
jellymoon-app = ["jellymoon-core", "sticker-kit"]

# The outside packages a crate may never list: in any dependency table, under any [target.*], or renamed with
# `package = "..."`. A name ending in `*` bars every package that starts so. Core and the binary never depend on GPUI
# or any of its `gpui_*` packages, so every rule can be proved with no display.
[forbidden]
jellymoon-core = ["gpui*"]
jellymoon = ["gpui*"]
