name: CI
# Disabled while the repo is private: it runs only when dispatched by hand. Local `make land` is the gate and
# nothing GitHub reports counts (a PR touching .github/workflows/ can fake any check). At public launch CI
# returns as a thin mirror of `make preflight` for outside contributors. See docs/development/landing.md.

# Verification loop (docs/development/workflow.md). When enabled, each check is a
# job here. A job whose code does not exist
# yet passes with a notice; it starts enforcing the moment its directory lands.
# Budget: 5 minutes wall clock for the whole workflow. There is no review gate in
# CI: `make land` is the only merge path (docs/development/landing.md).

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  gen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Portable (no symlink out of the repo, no machine-local path)
        run: make portable
      - name: Generated contracts match the schema
        run: make check-gen
      - name: Fixtures validate (ajv) and generated TS type-checks
        run: make test-ts
      - name: Entropy gate (budgets, ratchet, dead code, boundaries)
        run: make entropy
      - name: No secrets in history (gitleaks)
        run: make secrets

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Worker, DO and MCP tests
        run: |
          if [ ! -f worker/package.json ]; then echo "::notice::no worker/ yet; skipping"; exit 0; fi
          cd worker && npm ci && npx vitest run

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Daemon, ACP and TUI tests
        run: make test-go

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: install.sh against a fixture release
        run: |
          if [ ! -f worker/public/install.sh ]; then echo "::notice::no install.sh yet; skipping"; exit 0; fi
          make test-install

  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Full slice, local
        run: |
          if [ ! -d e2e ]; then echo "::notice::no e2e/ yet; skipping"; exit 0; fi
          make e2e

  e2e-preview:
    needs: gen-drift
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Deploy a per-PR preview and run the slice against it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -f worker/wrangler.toml ] && [ ! -f worker/wrangler.jsonc ]; then echo "::notice::no worker/wrangler config yet; skipping"; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set yet (owner action, the build plan); preview skipped"; exit 0
          fi
          echo "::error::preview deploy not wired yet (the build plan)"; exit 1
