name: Hosted
# The hosted instance (ADR 0010, docs/runbooks/hosted-instance.md): the server/ bundle in one Cloudflare Container behind the front
# Worker in hosted/. Two jobs:
#   dry-run  every pull request that touches what the image holds: type-checks the front, runs `wrangler deploy --dry-run` (which
#            builds the image with the runner's Docker and uploads nothing), then boots that image on a Postgres service container
#            in the hosted shape and runs the read-only live check against it. No Cloudflare credential is in this job.
#   gate,    off until a maintainer sets the repository variable JM_HOSTED_ENABLED to "true". Then they ship every main commit
#   deploy   whose CI run passed, and roll back to the last good deploy if the live check fails. Never deploy by hand (the owner's ruling).
# Docs: https://developers.cloudflare.com/containers/ and https://developers.cloudflare.com/workers/wrangler/commands/

on:
  # Never `pull_request_target`: it runs with secrets.
  pull_request:
    paths:
      - hosted/**
      - server/**
      - web/**
      - podcore/**
      - gen/**
      - package.json
      - bun.lock
      - .dockerignore
      - .github/workflows/hosted.yml
  workflow_dispatch:
  # A deploy waits for CI (ci.yml) to finish on the main push, so it ships only a commit whose checks passed.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - name: Dependencies of the front (pinned wrangler and @cloudflare/containers)
        working-directory: hosted
        run: bun install --frozen-lockfile
      - name: Type-check the front Worker
        working-directory: hosted
        run: node_modules/.bin/tsc -p tsconfig.json
      - name: wrangler deploy --dry-run (bundles the front, builds the image, uploads nothing)
        working-directory: hosted
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then echo "::error::the dry run must have no Cloudflare credential"; exit 1; fi
          node_modules/.bin/wrangler deploy --dry-run --outdir "$RUNNER_TEMP/out"
          ls -l "$RUNNER_TEMP/out"
      - name: Build the image for the boot check (Docker's cache holds the dry run's layers)
        run: docker build --platform linux/amd64 -f hosted/Dockerfile -t jellymoon-hosted:ci .
      - name: Boot the image in the hosted shape and run the live check against it
        run: |
          # The hosted shape: ENV unset, no TEST_BEARER, an https PUBLIC_URL behind one proxy (the image sets TRUST_PROXY=1).
          docker run -d --name jm --network host -e JM_BUILD="$GITHUB_SHA" \
            -e DATABASE_URL=postgres://postgres:ci@127.0.0.1:5432/postgres \
            -e PUBLIC_URL=https://jellymoon.invalid \
            jellymoon-hosted:ci
          i=0
          until curl -q -fsS -o /dev/null http://127.0.0.1:8080/healthz; do
            i=$((i+1))
            if [ "$(docker inspect -f '{{.State.Running}}' jm)" != true ]; then echo "::error::the image exited at boot"; docker logs jm; exit 1; fi
            if [ $i -gt 60 ]; then echo "::error::no /healthz 200 within 60 s"; docker logs jm; exit 1; fi
            sleep 1
          done
          make deployed-check DEPLOYED_URL=http://127.0.0.1:8080 || { docker logs jm; exit 1; }
          # The deploy accepts health only from the container that names its own commit (hosted/ship.sh).
          build=$(curl -q -s -D - -o /dev/null http://127.0.0.1:8080/healthz | tr -d '\r' | awk -F': ' 'tolower($1)=="x-jm-build" {print $2}')
          if [ "$build" != "$GITHUB_SHA" ]; then echo "::error::/healthz names build '${build}', want $GITHUB_SHA"; exit 1; fi
          # pglite is the local fallback only and must not be in the image (ADR 0006).
          if docker run --rm --entrypoint sh jellymoon-hosted:ci -c 'find / -path /proc -prune -o -name "pglite*" -print 2>/dev/null | grep -q .'; then
            echo "::error::pglite is in the image"; exit 1
          fi

  gate:
    # On only when the variable is "true". A workflow_run deploy needs CI's run on a push to this repository's main to have passed;
    # a dispatch must be on main and is checked for the same thing. A commit that is no longer main's head is skipped: the newer
    # commit deploys on its own run. Kept apart from deploy so a skipped commit is never recorded as a deployment.
    if: >-
      vars.JM_HOSTED_ENABLED == 'true' && (
        (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository)
        || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      ship: ${{ steps.gate.outputs.ship }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - name: CI passed on this commit, and it is main's head
        id: gate
        run: |
          ok=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success&per_page=1" --jq '.total_count')
          if [ "$ok" = 0 ]; then echo "::error::CI has not passed on $SHA (a push run of ci.yml); nothing is deployed"; exit 1; fi
          head=$(gh api "repos/$REPO/commits/main" --jq '.sha')
          if [ "$head" != "$SHA" ]; then
            echo "::notice::$SHA is no longer main's head ($head); the newer commit deploys on its own run"
            echo "ship=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          { echo "ship=true"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA"

  deploy:
    needs: gate
    if: needs.gate.outputs.ship == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: hosted
    permissions:
      contents: read
      deployments: read
    concurrency:
      group: hosted-deploy
      cancel-in-progress: false
    env:
      SHA: ${{ needs.gate.outputs.sha }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      # The repository's existing Cloudflare token (first made for the retired preview job; nothing else reads it now), with
      # Containers edit and Account Settings read added to it. Editing a token's permissions keeps its value.
      CLOUDFLARE_API_TOKEN: ${{ secrets.JM_CF_PREVIEW_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.JM_CF_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: The last good deploy (chosen here, under the deploy lock, so a deploy that finished while this one queued counts)
        id: prev
        run: |
          # GitHub records each deploy job as a deployment of the hosted environment with its commit and outcome. The rollback
          # target is the newest successful one that is not this commit.
          prev=""
          for row in $(gh api "repos/$REPO/deployments?environment=hosted&per_page=50" --jq '.[] | "\(.id):\(.sha)"'); do
            id=${row%%:*} sha=${row#*:}
            [ "$sha" = "$SHA" ] && continue
            state=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')
            if [ "$state" = success ]; then prev=$sha; break; fi
          done
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "Deploying $SHA; the last good deploy is ${prev:-none (first deploy)}"

      - name: The secrets file (mode 0600, values never printed)
        env:
          DATABASE_URL: ${{ secrets.JM_HOSTED_DATABASE_URL }}
          GITHUB_CLIENT_ID: ${{ secrets.JM_HOSTED_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.JM_HOSTED_GITHUB_CLIENT_SECRET }}
          JM_VAULT_KEY: ${{ secrets.JM_HOSTED_VAULT_KEY }}
          PUBLIC_URL: ${{ secrets.JM_HOSTED_PUBLIC_URL }}
        run: |
          # wrangler deploy --secrets-file sets every secret in the same Worker version as the code, so one deploy is one version
          # and the container starts once with all of them (a `wrangler secret put` each would make five versions).
          node -e '
            const names = ["DATABASE_URL", "GITHUB_CLIENT_ID", "GITHUB_CLIENT_SECRET", "JM_VAULT_KEY", "PUBLIC_URL"];
            const missing = names.filter((n) => !process.env[n]);
            if (missing.length) { console.error("::error::unset Actions secrets for: " + missing.join(", ")); process.exit(1); }
            require("fs").writeFileSync(process.argv[1], JSON.stringify(Object.fromEntries(names.map((n) => [n, process.env[n]]))), { mode: 0o600 });
          ' "$RUNNER_TEMP/secrets.json"
          # ship.sh is kept outside the checkout, so a rollback runs this commit's script against the older tree.
          cp hosted/ship.sh "$RUNNER_TEMP/ship.sh"

      - name: Install the front's pinned tools
        working-directory: hosted
        run: bun install --frozen-lockfile

      - name: Deploy, wait for /healthz, read-only live check
        id: deploy
        run: bash "$RUNNER_TEMP/ship.sh" "$GITHUB_WORKSPACE/hosted" "$RUNNER_TEMP/secrets.json" "$SHA" "jellymoon $SHA"

      - name: Roll back to the last good deploy
        if: failure() && steps.deploy.conclusion == 'failure'
        env:
          PREV: ${{ steps.prev.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then echo "::error::the deploy of $SHA failed and there is no earlier good deploy to roll back to"; exit 1; fi
          # A Worker version rollback (`wrangler rollback`) leaves the container image as it is
          # (https://developers.cloudflare.com/containers/platform-details/rollouts/: the rollout belongs to `wrangler deploy`), so
          # the last good commit is deployed again, image included (ADR 0010, "CI deploy" item 3).
          git checkout -q --detach "$PREV"
          (cd hosted && bun install --frozen-lockfile)
          bash "$RUNNER_TEMP/ship.sh" "$GITHUB_WORKSPACE/hosted" "$RUNNER_TEMP/secrets.json" "$PREV" "rollback to $PREV after a failed deploy of $SHA"
          echo "::error::the deploy of $SHA failed its live check; rolled back to $PREV"
          exit 1

      - name: Remove the secrets file
        if: always()
        run: rm -f -- "$RUNNER_TEMP/secrets.json"
