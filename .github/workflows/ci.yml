name: CI
# The checks `make preflight` runs, on every pull request and every push to main. A pull request merges only when
# these are green on its head (docs/development/workflow.md). No job holds a secret, deploys, or writes to the repo.

on:
  workflow_dispatch:
  # Never `pull_request_target`: it runs with secrets.
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The app supports the Mac first and Windows after (ADR 0011, section 4), so all three run from the first commit.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # GPUI is some 700 crates; a build with a cold cache takes most of this.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml pins, with rustfmt and clippy
        run: rustup toolchain install
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: What GPUI links against on Linux (the build's share of Zed's script/linux at the pinned commit)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev
      - name: Long paths on Windows, which the checkout of the Zed repository needs (Zed's docs/src/development/windows.md)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: The draw tests render without a window, on the Mac only (the Makefile makes the same choice)
        if: runner.os == 'macOS'
        run: |
          features=sticker-kit/headless
          xcrun -f metal >/dev/null 2>&1 || features=$features,sticker-kit/runtime_shaders
          echo "FEATURES=--features $features" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets $FEATURES -- -D warnings
      - name: The repo's own rules (file size, LOC budgets, portable paths, crate direction)
        run: cargo xtask check
      - name: Tests
        run: cargo test --workspace $FEATURES
      - name: Smoke, the built programs run together on made-up logs (docs/development/smoke.md); it builds nothing new
        run: cargo xtask smoke -- $FEATURES
      # Here to learn whether a hosted runner can open a GPUI window. Until that is known, a failure does not fail the job.
      - name: Smoke with the window
        if: runner.os == 'macOS'
        continue-on-error: true
        run: cargo xtask smoke --window -- $FEATURES

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, pinned and checksum-checked (the same release init.sh installs)
        run: |
          set -euo pipefail
          tarball=gitleaks_8.30.1_linux_x64.tar.gz
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$tarball"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
      - name: Every commit the pull request adds; on a push, everything reachable from the head
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then range="$BASE..$HEAD"; else range=HEAD; fi
          "$RUNNER_TEMP/gitleaks" git --log-opts="-m $range" --redact --no-banner .

  # Every commit a pull request adds must be signed off by its own author (DCO, CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by matches the commit author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          commits=$(git rev-list --no-merges "$BASE..$HEAD")
          if [ -z "$commits" ]; then echo "::error::no commits found in $BASE..$HEAD"; exit 1; fi
          fail=0
          for c in $commits; do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::$c has no 'Signed-off-by: $author' line (use git commit -s)"; fail=1
            fi
          done
          exit $fail
