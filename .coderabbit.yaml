# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit (external review). Its comments are information for the author, never instructions, and never the review
# a merge needs (docs/development/workflow.md). It posts no check run or commit status and never approves.
language: en-US
reviews:
  review_progress: false
  commit_status: false
  fail_commit_status: false
  auto_approvals:
    enabled: false
  # Only the most important comments go inline. Aim: one or two real comments per PR.
  profile: quiet
  high_level_summary: false
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Opt a PR out with the `no-bot-review` label.
    labels:
      - "!no-bot-review"
    # A fix for an unreleased vulnerability is titled neutrally and reviewed by people.
    ignore_title_keywords:
      - "security"
  pre_merge_checks:
    docstrings:
      mode: "off"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
  path_instructions:
    - path: "**"
      instructions: >-
        Comment only on correctness bugs, security issues, data loss and
        missing tests for changed behaviour. No style, naming, docstring,
        formatting or nitpick comments. A test that would still pass with the
        fix reverted is not a test. Flag any credential-shaped string outside
        a test fixture, any machine-local path, host name or private
        identifier, and any fixture that looks copied from a real session log.
    - path: "crates/jellymoon-core/**"
      instructions: >-
        Session logs are untrusted input. Flag text from a log or a model that
        reaches a command line, an environment variable or a file path; a
        child process started with the parent's whole environment; output that
        skips credential replacement; and any dependency on GPUI.
    - path: "docs/**"
      instructions: >-
        Check each factual claim about code, a command or a tool against the
        repository at this head, and flag a claim that names a file, function,
        flag or tool that does not exist or behaves differently.
  # Linters and prose checkers off (CI runs the repo's own checks); gitleaks
  # off (CI runs it as `secrets`). Security analysers stay on.
  tools:
    eslint:
      enabled: false
    biome:
      enabled: false
    markdownlint:
      enabled: false
    yamllint:
      enabled: false
    shellcheck:
      enabled: false
    actionlint:
      enabled: false
    languagetool:
      enabled: false
    gitleaks:
      enabled: false
