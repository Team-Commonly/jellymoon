name: Release
# Builds what install.sh downloads: one archive per Mac chip, each holding Jellymoon.app and the `jellymoon` binary,
# and a SHA256SUMS file (docs/development/install.md). Pushing a tag `v<version>` builds and publishes a release.
# Running it by hand builds the same archives and keeps them as workflow artifacts only: a rehearsal, no release,
# even when the run is started from a tag.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    # Both chips build on the Apple-chip runner; the Intel one is cross-compiled, as a Mac's own toolchain allows.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: The toolchain rust-toolchain.toml pins, and the target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      # Downloaded sources are cached; `target` is not. What a release ships is compiled in this run, and no object
      # file an earlier run left behind goes into it.
      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-sources-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - name: Build both programs in release mode
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # Shaders are compiled at build time when Xcode's `metal` is there (ADR 0013, point 5); when it is not,
          # the app compiles them as it starts. The log says which this release got.
          # A plain string, not an array: the Mac's bash 3.2 calls an empty array unbound under `set -u`.
          features=""
          if ! xcrun -f metal >/dev/null 2>&1; then
            echo "::warning::no Xcode metal on this runner: the app is built with runtime_shaders"
            features="--features jellymoon-app/runtime_shaders"
          fi
          # shellcheck disable=SC2086
          cargo build --release --locked --target "$TARGET" -p jellymoon -p jellymoon-app $features
      - name: Wrap, sign ad hoc and pack
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=0.0.0
          if [ "$REF_TYPE" = tag ]; then version=${REF_NAME#v}; fi
          sh app/macos/bundle.sh "target/$TARGET/release/jellymoon-app" "target/$TARGET/release/jellymoon" "$version" "$ARCH" dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellymoon-macos-${{ matrix.arch }}
          path: dist/jellymoon-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The only job that can write to the repo, and it runs no code from it: it sums the two archives and attaches them.
  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS, a draft release with every file, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum jellymoon-macos-arm64.tar.gz jellymoon-macos-x86_64.tar.gz > SHA256SUMS
          cat SHA256SUMS
          # A version with a dash (v0.2.0-rc1) is a pre-release, which `releases/latest` never points at.
          kind=""
          case "$TAG" in *-*) kind=--prerelease ;; esac
          # A draft first, with every file attached, and only then published: `releases/latest` never points at a
          # release that has an archive and no SHA256SUMS.
          # shellcheck disable=SC2086
          gh release create "$TAG" --draft $kind --verify-tag --generate-notes --title "Jellymoon $TAG" \
            jellymoon-macos-arm64.tar.gz jellymoon-macos-x86_64.tar.gz SHA256SUMS
          gh release edit "$TAG" --draft=false
