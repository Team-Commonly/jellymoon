[package]
name = "jellymoon"
version = "0.1.0"
description = "The jellymoon command: `day` prints what a person typed to their agents, `page` prints the day's page data."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "jellymoon"
path = "src/main.rs"

# The made-up harness the black-box tests run in place of Claude Code. A binary, not a script, so they run on Windows.
# Cargo only hands a test the path of a binary of its own package, which is why it is declared here. Never shipped.
[[bin]]
name = "fake-claude"
path = "tests/support/fake_claude.rs"
test = false
doc = false

# A made-up program for git to run as a hook, a filter or `core.fsmonitor` (F38). It leaves a mark beside itself.
[[bin]]
name = "fake-hook"
path = "tests/support/fake_hook.rs"
test = false
doc = false

# A made-up `git` that runs the real one and then never returns, for the time limit on a git child (F38).
[[bin]]
name = "fake-git"
path = "tests/support/fake_git.rs"
test = false
doc = false

# A made-up agent that `jellymoon run` starts in place of Claude Code (F39): it records how it was started and plays
# a scripted stream.
[[bin]]
name = "fake-agent"
path = "tests/support/fake_agent.rs"
test = false
doc = false

# A made-up asker for a run started apart (F41): it calls core's `run_apart` and exits, and stands in for the
# `jellymoon` command core starts, where it leaves the real command's exit code for a test to read.
[[bin]]
name = "fake-asker"
path = "tests/support/fake_asker.rs"
test = false
doc = false

# A made-up session that goes on typing into a log, for the test that a reading ends on a log that grows. It ends
# when the test's file says so, and by itself after 60 seconds or 200 MB.
[[bin]]
name = "fake-writer"
path = "tests/support/fake_writer.rs"
test = false
doc = false

[dependencies]
jellymoon-core.workspace = true
lexopt.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
