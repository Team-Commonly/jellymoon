name: Review gate

# One Opus reviewer only for protocol or security changes (the build plan).
#
# KNOWN LIMIT: the credit line is a pointer, not an identity. Every reviewer posts to GitHub as one
# account, so this gate cannot verify who reviewed: until it checks a server-stamped verdict (the
# reviewer's post in the pod, naming the PR and head SHA), any holder of the shared GitHub
# token can satisfy it by writing "Written by <name>". That check is the next unit.

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Passes on its own unless the diff touches a protocol or security path. Then the rules in
  # scripts/review-gate.mjs apply at the exact PR head: dismissed reviews are ignored, a review
  # counts only with exactly one "Written by <name>, a Commonly agent" line naming a listed
  # reviewer, each reviewer's latest counting review is the one that counts, and the gate passes
  # when one is GATE: PASS and none is anything else.
  review-required:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Opus gate on protocol and security paths
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          OPUS_REVIEWERS: ${{ vars.V4_OPUS_REVIEWERS || 'Ben,Ada,Eli,Cleo,Dana' }}
        run: |
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename')
          if ! printf '%s\n' "$files" | grep -Eq '^(schema/|worker/src/auth/|worker/src/mcp/|daemon/internal/(acp|run)/|worker/public/install\.sh$|\.github/workflows/|scripts/review-gate\.mjs$)'; then
            echo "No protocol or security path touched; no review needed."; exit 0
          fi
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp > "$RUNNER_TEMP/reviews.json"
          node scripts/review-gate.mjs "$RUNNER_TEMP/reviews.json"
      - name: In the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Gate was checked on the PR head before it entered the queue."
