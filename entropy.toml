# The workspace crates each crate may depend on. Core depends on none; the binary only on core.
[depends]
jellymoon-core = []
jellymoon = ["jellymoon-core"]
xtask = []
# The kit knows nothing of Jellymoon; the app is the only crate that joins the kit and core.
sticker-kit = []
jellymoon-app = ["jellymoon-core", "sticker-kit"]

# The outside packages a crate may never list: in any dependency table, under any [target.*], or renamed with
# `package = "..."`. A name ending in `*` bars every package that starts so. Core and the binary never depend on GPUI
# or any of its `gpui_*` packages, so every rule can be proved with no display.
[forbidden]
jellymoon-core = ["gpui*"]
jellymoon = ["gpui*"]
