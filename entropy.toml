# `Show me` in turn raised it by 48: the first tap brings the rows with no file and each later tap a file the page
# draws (`src/told.rs`, `src/working.rs`, 27), with its test (`tests/result_in_plain_words.rs`, 21).
# The next change in turn raised it by 25: the first look tells of every older wish whose work waits, so each
# comes after a keep or a toss of the one shown (`src/showing.rs`, 16), with its test (`tests/work_shows.rs`, 9).
# One answer on the page raised it by 28: an answer takes the place of what was said of another wish's work
# (`src/placing.rs`, which holds the two placing functions moved out of `src/working.rs`, 12), with its test
# (`tests/work_shows.rs`, 16).
# A tossed change is no star raised it by 22: a made wish that was let go draws no star and is not listed as come
# true (`src/scene.rs`, 10), with its tests (`src/scene/tests.rs`, 9, and `tests/f47/asked.rs`, 3).
# F91 raised the app by 320: `src/shaping.rs`, 106 (the three notes and the tap), 20 where a wish is entered and
# answered, its tests, 188 (`tests/shape_first.rs`), and Enter in the entry for the made-up window, 6.
# The owner's walk of F91 added 2, both in its test: the question row stands before the reason row, pinned.
# F91's gate raised it by 22: a sharper wish stays when another wish is opened (`src/placing.rs`, 2, and its test,
# 20).
"app" = 16691

# The workspace crates each crate may depend on. Core depends on none; the binary only on core.
[depends]
jellymoon-core = []
jellymoon = ["jellymoon-core"]
xtask = []
# The kit knows nothing of Jellymoon; the app is the only crate that joins the kit and core.
sticker-kit = []
jellymoon-app = ["jellymoon-core", "sticker-kit"]

# The outside packages a crate may never list: in any dependency table, under any [target.*], or renamed with
# `package = "..."`. A name ending in `*` bars every package that starts so. Core and the binary never depend on GPUI
# or any of its `gpui_*` packages, so every rule can be proved with no display.
[forbidden]
jellymoon-core = ["gpui*"]
jellymoon = ["gpui*"]
