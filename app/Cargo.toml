[package]
name = "jellymoon-app"
version = "0.1.0"
description = "The shell: turns page data into the kit's scene, prints where each piece goes, and draws it in a window."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "jellymoon-app"

[features]
default = ["window"]
# The window, and with it GPUI. Without it the crate is the scene and the layout command only.
window = ["sticker-kit/gpui", "dep:gpui", "dep:gpui_platform"]
# Compile Metal shaders at run time, for a Mac without the full Xcode toolchain.
runtime_shaders = ["window", "sticker-kit/runtime_shaders"]
# Windowless rendering, for the snapshot example.
headless = ["window", "sticker-kit/headless"]

[dependencies]
jellymoon-core.workspace = true
sticker-kit.workspace = true
jiff.workspace = true
lexopt.workspace = true
serde.workspace = true
serde_json.workspace = true
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

# The made-up harness the F34 tests run in place of Claude Code: the same source file as the `jellymoon` package's,
# declared again because Cargo hands a test the path of a binary of its own package only. Never shipped.
[[bin]]
name = "f34-claude"
path = "../crates/jellymoon/tests/support/fake_claude.rs"
test = false
doc = false

# What the F42 tests start, for the same reason: the `jellymoon` command, which core starts as a wish's run; the
# made-up agent that run starts in place of Claude Code; and a made-up window, which enters one wish through
# `wishing.rs` in a process of its own with no variable of the caller's. Never shipped.
[[bin]]
name = "f42-jellymoon"
path = "../crates/jellymoon/src/main.rs"
test = false
doc = false

[[bin]]
name = "f42-agent"
path = "../crates/jellymoon/tests/support/fake_agent.rs"
test = false
doc = false

[[bin]]
name = "f42-wisher"
path = "tests/support/wisher.rs"
test = false
doc = false

[lints]
workspace = true

[[example]]
name = "snapshot"
required-features = ["headless"]
