[package]
name = "jellymoon-core"
version = "0.1.0"
description = "The journal app without a screen: the reader, credential redaction, page data and the reading call."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
regex.workspace = true
serde.workspace = true
# raw_value: the hook is spliced into the settings text at the place serde_json found, so every other byte stays.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true

[lints]
workspace = true
