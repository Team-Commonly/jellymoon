name: CI
# Off until the repo goes public: it runs only when dispatched by hand. Local `make land` is the gate and nothing GitHub
# reports counts (docs/development/landing.md); CI's role after the flip is a separate ruling. The workflow is already
# fork-safe, so enabling it is a one-line change.

# Verification loop (docs/development/workflow.md). Each check is a job here. A job whose code does not exist
# yet passes with a notice; it starts enforcing the moment its directory lands.
# Budget: 5 minutes wall clock for the whole workflow.

on:
  workflow_dispatch:
  # The public flip enables these two triggers (uncomment). Never `pull_request_target`: it runs with secrets.
  # pull_request:
  # push:
  #   branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. No job that runs on a pull request can read a secret (see e2e-preview).
permissions:
  contents: read

jobs:
  gen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Portable (no symlink out of the repo, no machine-local path)
        run: make portable
      - name: Generated contracts match the schema
        run: make check-gen
      - name: Fixtures validate (ajv) and generated TS type-checks
        run: make test-ts
      - name: Entropy gate (budgets, ratchet, dead code, boundaries)
        run: make entropy

  private:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .tool-versions
      - name: Nothing private in tracked files (the deny check)
        run: make private

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Fetch every remote branch
        run: git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Full history of all branches (merge commits included) and the tracked tree (gitleaks)
        run: make secrets-all

  # Only on a pull request: every commit the PR adds must be signed off by its own author (DCO, CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by matches the commit author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::$c has no 'Signed-off-by: $author' line (use git commit -s)"; fail=1
            fi
          done
          exit $fail

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Worker, DO and MCP tests
        run: |
          if [ ! -f worker/package.json ]; then echo "::notice::no worker/ yet; skipping"; exit 0; fi
          cd worker && npm ci && npx vitest run

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Daemon, ACP and TUI tests
        run: make test-go

  install:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: install.sh against a fixture release
        run: |
          if [ ! -f worker/public/install.sh ]; then echo "::notice::no install.sh yet; skipping"; exit 0; fi
          make test-install

  e2e-local:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Full slice, local
        run: |
          if [ ! -d e2e ]; then echo "::notice::no e2e/ yet; skipping"; exit 0; fi
          make e2e

  e2e-preview:
    # Needs a secret, so it never runs on a pull request from a fork.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: gen-drift
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Deploy a per-PR preview and run the slice against it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ ! -f worker/wrangler.toml ] && [ ! -f worker/wrangler.jsonc ]; then echo "::notice::no worker/wrangler config yet; skipping"; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret not set yet (owner action); preview skipped"; exit 0
          fi
          echo "::error::preview deploy not wired yet"; exit 1
