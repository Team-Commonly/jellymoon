[package]
name = "jellymoon-core"
version = "0.1.0"
description = "The journal app without a screen: the reader, credential redaction, page data and the reading call."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
jiff.workspace = true
regex.workspace = true
serde.workspace = true
# raw_value: the hook is spliced into the settings text at the place serde_json found, so every other byte stays.
serde_json = { workspace = true, features = ["raw_value"] }
tempfile.workspace = true

# A run's child is asked to stop before it is killed, and the child a cut-off run left is stopped by its pid
# (`run/child.rs`, `run/dead.rs`): a signal to a process group, which the standard library cannot send. The version
# is the one tempfile already brings in (docs/adr/0014, "Measured").
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[lints]
workspace = true
