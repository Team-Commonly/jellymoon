# The numbers `cargo xtask check` holds the repo to (crates/xtask/src/rules.rs). A budget may be raised only with a
# reason in the same change; how long a function may be is in clippy.toml.

# The most lines a Rust file may have.
max_file_lines = 400

# The most lines of Rust each crate may hold, tests included. Every crate needs one.
[budget]
# Finding the harness off `PATH` raised the next two: core by 94 (`find.rs`: the well-known places, the mode checks,
# the child's `PATH`, the one home) and the binary by 273 (its tests at the binary, `tests/harness.rs`, are 252 of them).
# The first run raised them again: core by 120 (the reader of `skip.txt`, moved in from the app, with what it refuses;
# the one rule for Jellymoon's home; four plain errors) and the binary by 354 (its tests at the binary:
# `tests/first_run.rs`, one in `tests/f33.rs` and the helper that compares a whole folder).
# The closed list of characters that cannot be seen, and the check of `--skip` names against it, raised core by 25
# and the binary by 17 (the test's array of every entry).
# F35 and F36 raised them once more: core by 448 (`tap.rs`, the tap's rules, is 274 and `command.rs`, the check of the
# installed command, 105; the rest is `hook_installed`, the waiting rulings and the create-new write)
# and the binary by 786 (`settle`, `hook status` and `hook install --installed`; nearly all of it their tests at the binary:
# `tests/f35.rs`, `tests/f35/delivery.rs` and `tests/f35/lock.rs`).
# The tidy before the first release raised them by 43 and 194, all but 4 lines of it tests: core's walk of the whole
# table of unseen characters and its case of an empty statement; the binary's `tests/f33/modes.rs` (the installer
# under a umask of 002), the cases of no home and of 32 links, and the helper that finds an open folder above a test.
# F38, a run's copy, raised core by 524 (`copy.rs`, the copy's rules, is 338 and `copy/git.rs`, the git child, what
# it switches off and its time limit, 181) and the binary by 710 (`copy make` and `copy clean`, 42; the rest is their
# tests at the binary, `tests/f38.rs`, `tests/f38/hostile.rs` and `tests/f38/limits.rs`, and the two made-up programs:
# one for git to start, one that is a git that never returns).
# F37, a made wish, raised core by 229 (`wish.rs`, its rules, its kept file and one test, is 203; the day's lock as one
# function for the tap and the wish; the example of what it prints, round-tripped) and the binary by 411 (`wish`
# and its parsing are 24; the rest is its tests at the binary, `tests/f37.rs` and `tests/f37/refused.rs`).
# The fixes after the reviews of F38 and F37 raised core by 191 and the binary by 120. Core: `redact/twice.rs`, 102,
# is the test that a text cleaned twice is the text cleaned once, over twenty thousand built texts; cleaning in the
# order that makes it so is 26; a copy's repo taken only at its top, its failed runs in their own order and the
# folder nobody stands for are 27; each transport the config names switched off, with its test, is 36. The binary:
# all of it tests of those cases (`tests/f38/hostile.rs`, `tests/f38/limits.rs`, `tests/f37/refused.rs`,
# `tests/f35/lock.rs`).
# A file in use on Windows raised core by 119: `busy.rs`, 105, of which 56 are its two tests (which errors are a
# file in use, and how long a step is tried again), and its four callers in the day's lock, read and write, 14.
# The binary by 2, the comment on the wishes made at once, now twelve rounds.
# F39, a run, raised core by 835 (`run.rs`, a run's order and its fixed words, is 387; `run/child.rs`, the harness
# child, the caps on its stream and its stop, 184; `run/record.rs`, a run's record, 59; `run/dead.rs`, the child a
# cut-off run left, told from a later process of its pid and stopped, 64; the rest is a wish's `run` and `why` and
# its change behind the day's lock, the folders of a day, taking a copy back, and the examples of what a run prints)
# and the binary by 1109 (`run` and its parsing are 23; the rest is its tests at the binary, `tests/f39.rs` and
# `tests/f39/`, and the made-up agent they start, `tests/support/fake_agent.rs`).
"crates/jellymoon-core" = 5031
"crates/jellymoon" = 6122
# The smoke chain raised xtask by 464: the runner, its nine steps and their tests (docs/development/smoke.md); F29's
# four delivery steps raised it by 76, and the step for a harness found off `PATH` by 30. The step for a home with no
# session logs raised it by 12, and F35's three steps (`tap`, `tap-told`, `today-settled`) by 49.
# F38's step (`copy`, in `smoke/copy.rs`: it makes a repo with the real git) raised it by 69.
# F37's step, `wish`, raised it by 25.
# F39's step, `run` (`smoke/run.rs`, 72 lines), and the repo command it shares with `copy` raised it by 84.
"crates/xtask" = 1269
# F32 raised the next two: the kit by 291 (the F32 test, the edge tests of the theme door's limits, two draw tests;
# 265 of the lines are tests) and the app by 89 (`--theme <file>`, and its case at the binary, 60 lines).
# The art's counted cost raised the kit by 247 (the two counts at the door, their edge tests in `tests/cost.rs`).
# A whole choice (F35: every word of an option, or the note left out) raised the kit by 110: 84 are `tests/whole.rs`.
# A text run's own size, which the drawing paints at, raised the kit by 80: 77 are the two tests that hold it
# (`tests/whole.rs` by measure, `tests/draw.rs` by what is painted).
# A whole list (F37: a made wish's words after its mark, each row drawn to its last word or counted) raised the kit
# by 156: 51 are its test in `tests/whole.rs`; the rest is its layout below the other notes, in the room they leave
# and at its own step, the mark's piece and its drawing.
# The test of the one state where a whole list is not said among the notes raised it by 30 (`tests/whole.rs`).
"crates/sticker-kit" = 5739
# F29 raised the app by 9: the arm for core's new errors where it puts an error into words. Its note for a harness
# that was not found names the places looked in: 1 line.
# The app's test of a `--skip` name that is refused: 6 lines.
# F35 raised the app by 560: `taps.rs` (a tap carried to core and drawn), its cases in `tests/f35.rs`, and the
# scene, the window and the day drawing what core says stands.
# The tidy raised the app by 47: a run's `size` in `layout` (9 lines), its assertion, and the test helper that
# finds an open folder above a test.
# F38 raised the app by 1: the arm for core's new error where it puts an error into words.
# F37 raised the app by 218: 171 are `tests/f37.rs`; the rest draws the day's made wishes, their note and the
# footer's count of them, also on a day not read yet.
# The case of a clash on a page with no wish read, which a made wish moves up, raised it by 36 (`tests/f37.rs`).
# F39 raised the app by 1: the arm for core's new error where it puts an error into words.
"app" = 3297

# The workspace crates each crate may depend on. Core depends on none; the binary only on core.
[depends]
jellymoon-core = []
jellymoon = ["jellymoon-core"]
xtask = []
# The kit knows nothing of Jellymoon; the app is the only crate that joins the kit and core.
sticker-kit = []
jellymoon-app = ["jellymoon-core", "sticker-kit"]

# The outside packages a crate may never list: in any dependency table, under any [target.*], or renamed with
# `package = "..."`. A name ending in `*` bars every package that starts so. Core and the binary never depend on GPUI
# or any of its `gpui_*` packages, so every rule can be proved with no display.
[forbidden]
jellymoon-core = ["gpui*"]
jellymoon = ["gpui*"]
