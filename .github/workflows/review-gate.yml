name: Review gate

# One Opus reviewer only for protocol or security changes (the build plan).
#
# This check cannot judge its own change: a PR touching review-gate.yml (run from the PR's merge ref)
# or scripts/review-gate.mjs is judged by a person at press time, never by the green tick.
#
# KNOWN LIMIT: the credit line is a pointer, not an identity. Every reviewer posts to GitHub as one
# account, so this gate cannot verify who reviewed: until it checks a server-stamped verdict (the
# reviewer's post in the pod, naming the PR and head SHA), any holder of the shared GitHub
# token can satisfy it by writing "Written by <name>". That check is the next unit.

on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Passes on its own unless the diff touches a protocol or security path. Then the rules in
  # scripts/review-gate.mjs (base copy) apply at the exact PR head and fail closed; the rules are
  # written at the top of that file and in docs/development/workflow.md. Reviewers: .github/opus-reviewers.txt.
  review-required:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The judge comes from the BASE branch, never from the PR it judges: a PR that edited
      # scripts/review-gate.mjs could otherwise make its own check green with zero reviews.
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/review-gate.mjs
            .github/opus-reviewers.txt
          sparse-checkout-cone-mode: false
      - name: Opus gate on protocol and security paths
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ ! -f scripts/review-gate.mjs ] || [ ! -f .github/opus-reviewers.txt ]; then
            echo "::error::bootstrap: the base branch has no scripts/review-gate.mjs or .github/opus-reviewers.txt, so this gate cannot judge. Fail closed: a person checks the Opus GATE: PASS at the head by hand and merges this PR by hand."
            exit 1
          fi
          gh api "repos/$REPO/pulls/$PR/files" --paginate --slurp > "$RUNNER_TEMP/files.json"
          gh api "repos/$REPO/pulls/$PR/reviews" --paginate --slurp > "$RUNNER_TEMP/reviews.json"
          node scripts/review-gate.mjs "$RUNNER_TEMP/reviews.json" .github/opus-reviewers.txt "$RUNNER_TEMP/files.json"
      - name: In the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Gate was checked on the PR head before it entered the queue."
